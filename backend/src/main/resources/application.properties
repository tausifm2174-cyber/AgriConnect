# ===================================================================
# AgriConnect Application Properties (Phase 1: Foundation)
# ===================================================================

# Application Details
spring.application.name=AgriConnect

# Server Port
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (MySQL)
# Default values can be overridden via environment variables:
# DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agriconnect_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
# Fail fast on startup if database cannot be reached, ensuring connection issues are never silently ignored
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# Database-First Principle: We do not allow Hibernate to auto-create
# or alter schema tables. Proper relational design is maintained in Phase 2.
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# JWT Authentication Configuration (Phase 3)
# Secret can be overridden via JWT_SECRET environment variable
# -------------------------------------------------------------------
jwt.secret=${JWT_SECRET:default-dev-secret-change-me-in-production-32chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


